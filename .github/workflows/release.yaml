---
name: Release

on:
  push:
    branches:
      - main

env:
  RUST_BACKTRACE: 1

jobs:
  release:
    permissions:
      contents: write
      packages: write
      id-token: write
      issues: write
      pull-requests: write
    uses: semantic-release-action/rust/.github/workflows/release-library.yml@v5
    with:
      github_app_id: ${{ vars.SEMANTIC_RELEASE_APP_ID }}
      submodules: true
      toolchain: stable
    secrets:
      cargo-registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      github_app_private_key: ${{ secrets.SEMANTIC_RELEASE_APP_KEY }}
